<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nila Gao, AI Designer @ Klaviyo</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/scroll-reveal.css">
<noscript><style>.reveal-on-scroll { opacity: 1 !important; transform: none !important; }</style></noscript>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Figtree', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #0A0A09;
  color: #F2EDE6;
  line-height: 1.6;
}

a { text-decoration: none; color: inherit; }

/* ── Nav ── */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10,10,9,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 0.5px solid rgba(242,237,230,0.06);
  transition: transform 0.3s ease-in-out;
}
.top-nav.hidden { transform: translateY(-100%); }
.top-nav-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 1.1rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nav-left {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(242,237,230,0.45);
}
.nav-left a { color: inherit; }
.nav-left a:hover { color: #F2EDE6; }
.nav-right { display: flex; gap: 1.75rem; }
.nav-right a {
  font-size: 0.78rem;
  color: rgba(242,237,230,0.28);
  letter-spacing: 0.02em;
  transition: color 0.15s;
}
.nav-right a:hover { color: #F2EDE6; }

/* ── Hero ── */
.hero {
  max-width: 960px;
  margin: 0 auto;
  padding: 3.5rem 1.5rem 3rem;
}
.hero-big {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(3rem, 7vw, 5rem);
  font-weight: 700;
  line-height: 0.93;
  letter-spacing: -0.04em;
  color: #F2EDE6;
  margin: 0 0 1.75rem;
}
.hero-big .dim { color: rgba(242,237,230,0.15); }
.hero-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 1.5rem;
  flex-wrap: wrap;
}
.hero-left { display: flex; flex-direction: column; gap: 1rem; }
.hero-sub {
  font-size: 0.88rem;
  color: rgba(242,237,230,0.38);
  line-height: 1.65;
  max-width: 360px;
}
.hero-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.hero-chip {
  font-size: 0.68rem;
  letter-spacing: 0.05em;
  padding: 3px 11px;
  border-radius: 99px;
  border: 0.5px solid rgba(184,169,142,0.28);
  color: rgba(184,169,142,0.65);
}
.hero-cta {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #0A0A09;
  background: #B8A98E;
  padding: 0.6rem 1.35rem;
  border-radius: 99px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: opacity 0.15s;
}
.hero-cta:hover { opacity: 0.85; }

/* ── Divider ── */
.divider {
  height: 0.5px;
  background: rgba(242,237,230,0.07);
  margin: 0 1.5rem;
}

/* ── Projects ── */
.projects-section {
  max-width: 960px;
  margin: 0 auto;
  padding: 3rem 1.5rem 4rem;
}
.section-label {
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(242,237,230,0.25);
  margin-bottom: 1.75rem;
}

.grid-top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  margin-bottom: 1.25rem;
}
.card-top {
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  overflow: hidden;
  background: #141412;
  border: 0.5px solid rgba(242,237,230,0.07);
  transition: border-color 0.2s;
}
.card-top:hover { border-color: rgba(184,169,142,0.25); }
.card-top:hover .card-title { color: #B8A98E; }
.card-top-img {
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  background: #22201e;
  display: block;
}
.card-top-img--contain { object-fit: contain; background: #1a1816; }

.grid-bot {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.25rem;
}
.card-bot {
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  overflow: hidden;
  background: #141412;
  border: 0.5px solid rgba(242,237,230,0.07);
  transition: border-color 0.2s;
}
.card-bot:hover { border-color: rgba(184,169,142,0.25); }
.card-bot:hover .card-title { color: #B8A98E; }
.card-bot-img {
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  background: #1e1c1a;
  display: block;
}
.card-bot-img--audience {
  background-image: url('Images/Homepage/Purple_background.png');
  background-size: cover;
  background-position: center;
}

.card-top .card-body { padding: 0.875rem 1rem 1rem; }
.card-bot .card-body { padding: 0.6rem 0.75rem 0.75rem; }

.card-title {
  font-weight: 500;
  color: #F2EDE6;
  margin: 0 0 0.35rem;
  line-height: 1.3;
  transition: color 0.15s;
}
.card-top .card-title { font-size: 0.9rem; }
.card-bot .card-title { font-size: 0.75rem; }

.card-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.card-tag {
  font-size: 0.63rem;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 99px;
  border: 0.5px solid rgba(184,169,142,0.22);
  color: rgba(184,169,142,0.55);
}
.card-bot .card-tag { font-size: 0.6rem; }

.fade-in {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.55s ease-out, transform 0.55s ease-out;
}
.fade-in.visible { opacity: 1; transform: translateY(0); }

footer {
  border-top: 0.5px solid rgba(242,237,230,0.07);
  padding: 1.5rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 960px;
  margin: 0 auto;
  font-size: 0.78rem;
  color: rgba(242,237,230,0.25);
}
.footer-links { display: flex; gap: 1.25rem; }
.footer-links a { color: rgba(242,237,230,0.25); transition: color 0.15s; }
.footer-links a:hover { color: rgba(242,237,230,0.6); }

@media (max-width: 700px) {
  .nav-right { display: none; }
  .hero-big { font-size: 2.6rem; }
  .hero-cta { width: 100%; text-align: center; }
  .grid-top { grid-template-columns: 1fr; }
  .grid-bot { grid-template-columns: repeat(2, 1fr); }
  footer { flex-direction: column; gap: 0.75rem; text-align: center; }
}
@media (min-width: 701px) and (max-width: 900px) {
  .grid-bot { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <h1 class="hero-big">AI<br><span class="dim">DESIGNER</span><br>@ KLAVIYO</h1>
    <div class="hero-bottom">
      <div class="hero-left">
        <p class="hero-sub">Designing the machine-learning features that make email marketing feel less like guesswork.</p>
        <div class="hero-chips">
          <span class="hero-chip">AI Personalization</span>
          <span class="hero-chip">ML Decisioning</span>
          <span class="hero-chip">B2B SaaS</span>
          <span class="hero-chip">Product Design</span>
        </div>
      </div>
      <a href="#projects" class="hero-cta">View work ↓</a>
    </div>
  </section>

  <div class="divider"></div>
