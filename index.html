<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Figtree', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #0A0A09;
  color: #F2EDE6;
  line-height: 1.6;
}

a { text-decoration: none; color: inherit; }

/* ── Nav ── */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10,10,9,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 0.5px solid rgba(242,237,230,0.06);
  transition: transform 0.3s ease-in-out;
}
.top-nav.hidden { transform: translateY(-100%); }
.top-nav-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 1.1rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nav-left {
  font-size: 1rem;
  font-weight: 600;
  color: rgba(242,237,230,0.85);
  letter-spacing: -0.01em;
}
.nav-left a { color: inherit; }
.nav-left a:hover { color: #F2EDE6; }
.nav-right { display: flex; gap: 1.75rem; }
.nav-right a {
  font-size: 0.82rem;
  color: rgba(242,237,230,0.35);
  transition: color 0.15s;
}
.nav-right a:hover { color: #F2EDE6; }

/* ── Hero ── */
.hero {
  max-width: 960px;
  margin: 0 auto;
  padding: 3rem 1.5rem 2rem;
  text-align: center;
}
.hero-eyebrow {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #B8A98E;
  margin-bottom: 1rem;
}
.hero-h1 {
  font-size: clamp(2rem, 5vw, 2.6rem);
  font-weight: 700;
  color: #F2EDE6;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin: 0 0 0.875rem;
}
.hero-sub {
  font-size: 0.9rem;
  color: rgba(242,237,230,0.4);
  max-width: 420px;
  margin: 0 auto;
  line-height: 1.7;
}

/* ── Divider ── */
.divider {
  height: 0.5px;
  background: rgba(242,237,230,0.07);
  margin: 1.5rem 1.5rem 0;
}

/* ── Projects ── */
.projects-section {
  max-width: 960px;
  margin: 0 auto;
  padding: 1.5rem 1.5rem 4rem;
}
.section-label {
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(242,237,230,0.25);
  margin-bottom: 1.75rem;
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
}
.project-card {
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  overflow: hidden;
  background: #141412;
  border: 0.5px solid rgba(242,237,230,0.07);
  transition: border-color 0.2s;
}
.project-card:hover { border-color: rgba(184,169,142,0.25); }
.project-card:hover .card-title { color: #B8A98E; }
.project-card-img {
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  background: #1e1c1a;
  display: block;
}
.project-card-img--contain { object-fit: contain; background: #1a1816; }
.project-card-img--audience {
  background-image: url('Images/Homepage/Purple_background.png');
  background-size: cover;
  background-position: center;
}
.project-card .card-body { padding: 0.875rem 1rem 1rem; }

.card-title {
  font-weight: 500;
  color: #F2EDE6;
  margin: 0 0 0.35rem;
  line-height: 1.3;
  transition: color 0.15s;
}
.card-top .card-title { font-size: 0.9rem; }
.card-bot .card-title { font-size: 0.75rem; }

.card-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.card-tag {
  font-size: 0.63rem;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 99px;
  border: 0.5px solid rgba(184,169,142,0.22);
  color: rgba(184,169,142,0.55);
}
.card-bot .card-tag { font-size: 0.6rem; }

/* ── Fade-in ── */
.fade-in {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.55s ease-out, transform 0.55s ease-out;
}
.fade-in.visible { opacity: 1; transform: translateY(0); }

/* ── Footer ── */
footer {
  border-top: 0.5px solid rgba(242,237,230,0.07);
  padding: 1.5rem 1.5rem;
  text-align: center;
  font-size: 0.78rem;
  color: rgba(242,237,230,0.25);
}

/* ── Responsive ── */
@media (max-width: 700px) {
  .nav-right { display: none; }
  .hero-h1 { font-size: 2rem; }
  .projects-grid { grid-template-columns: 1fr; }
}
@media (min-width: 701px) and (max-width: 900px) {
  .projects-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<script>
const nav = document.getElementById('top-nav');
let lastScroll = 0, ticking = false;
window.addEventListener('scroll', () => {
  if (!ticking) {
    window.requestAnimationFrame(() => {
      const cur = window.pageYOffset;
      if (cur <= 0) nav.classList.remove('hidden');
      else if (cur > lastScroll && cur > 80) nav.classList.add('hidden');
      else nav.classList.remove('hidden');
      lastScroll = cur;
      ticking = false;
    });
    ticking = true;
  }
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>
<script src="js/scroll-reveal.js" defer></script>
