* { box-sizing: border-box; margin: 0; padding: 0; }

  backdrop-filter: blur(8px);

}
.top-nav.hidden { transform: translateY(-100%); }
.top-nav-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 1.1rem 1.5rem;
  display: flex;
  justify-content: space-between;

}
.nav-left {

}

.about-photo {

  border-radius: 10px;
  border: 0.5px solid rgba(242,237,230,0.07);
  margin-bottom: 2rem;
  overflow: hidden;
  display: block;
}
.about-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.about-h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 2.4rem;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: #F2EDE6;
  margin: 0 0 1.75rem;
}
.about-h1 em {
  font-style: italic;
  color: #B8A98E;
}

.about-section {
  padding: 1.35rem 0;
  border-top: 0.5px solid rgba(242,237,230,0.06);
}
.about-label {
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(242,237,230,0.2);
  margin-bottom: 0.75rem;
}

  font-size: 0.83rem;

  color: rgba(242,237,230,0.48);

.about-p:last-of-type { margin-bottom: 0; }
.about-p strong {
  color: rgba(242,237,230,0.78);

}
.about-p em {
  font-style: italic;
  color: #B8A98E;
}

.about-pills {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-top: 0.875rem;
}

  letter-spacing: 0.04em;
  padding: 4px 12px;
  border-radius: 99px;
  border: 0.5px solid rgba(184,169,142,0.25);
  color: rgba(184,169,142,0.65);
}

.about-contact {
  display: flex;
  gap: 0.75rem;
  margin-top: 1.25rem;
  flex-wrap: wrap;
}
.about-contact a {

  letter-spacing: 0.05em;
  padding: 0.45rem 1rem;
  border-radius: 99px;
  border: 0.5px solid rgba(184,169,142,0.28);
  color: rgba(184,169,142,0.7);
  transition: border-color 0.15s, color 0.15s;
}
.about-contact a:hover {
  border-color: rgba(184,169,142,0.6);
  color: #B8A98E;
}

footer {

  padding: 1.5rem 1.5rem;

  justify-content: space-between;
  align-items: center;

  margin: 0 auto;
  font-size: 0.78rem;
  color: rgba(242,237,230,0.25);

.footer-links a:hover { color: rgba(242,237,230,0.6); }

  .nav-right { display: none; }
  .about-h1 { font-size: 2rem; }
  footer { flex-direction: column; gap: 0.75rem; text-align: center; }
}
