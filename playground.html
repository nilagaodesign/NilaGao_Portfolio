.cs-img-wrap img { width: 100%; height: auto; display: block; }
.cs-img-wrap video { width: 100%; display: block; background: #1a1a1a; }

/* cover: fills container, crops to ratio */
.img-cover    { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: center top; }
.img-cover-21 { width: 100%; aspect-ratio: 21/9; object-fit: cover; object-position: center; }

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Figtree', sans-serif; background: #FFFFFF; color: #1A1916; line-height: 1.6; }
a { text-decoration: none; color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid #a15d11; outline-offset: 3px; border-radius: 3px; }

/* Nav — identical to index.html */
.top-nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 0.5px solid rgba(232,226,217,0.9); transition: transform 0.3s ease-in-out; }
.top-nav.hidden { transform: translateY(-100%); }
.top-nav-inner { max-width: 960px; margin: 0 auto; padding: 1.1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
.nav-left { font-size: 1rem; font-weight: 600; color: rgba(26,24,22,0.85); letter-spacing: -0.01em; }
.nav-left a { color: inherit; }
.nav-left a:hover { color: #1A1916; }
.nav-right { display: flex; gap: 1.75rem; }
.nav-right a { font-size: 0.82rem; color: #717070; transition: color 0.15s; min-height: 44px; display: inline-flex; align-items: center; }
.nav-right a:hover { color: #1A1916; }
.nav-right a.active { color: rgba(26,24,22,0.7); }

/* Page wrap — same max-width and padding as index */
.pg-wrap { max-width: 960px; margin: 0 auto; }

/* Hero — same structure as index hero */
.hero { padding: 3rem 1.5rem 2rem; text-align: left; }
.hero-eyebrow { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: #B8A98E; margin-bottom: 1rem; }
.hero-h1 { font-size: clamp(2.2rem, 5.5vw, 2.8rem); font-weight: 700; color: #1A1916; letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 0.875rem; }
.hero-sub { font-size: 1.1rem; color: #636160; max-width: 100%; line-height: 1.7; }

/* Divider — same as index */

/* Grid section — same as index projects-section */
.pg-section { max-width: 960px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

/* Cards — same style as index project-card but 2-col */
.pg-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }

.pg-card { display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; background: #F7F5F2; border: 0.5px solid rgba(242,237,230,0.08); transition: border-color 0.2s; }
.pg-card:hover { border-color: rgba(161,93,17,0.25); }
.pg-card:hover .pg-card-title { color: #B8A98E; }

.pg-card-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: #EDEAE5; display: block; transition: transform 0.35s ease; }
.pg-card-img--contain { object-fit: contain; background: #EDEAE5; }
.pg-card:hover .pg-card-img { transform: scale(1.02); }

.pg-card-body { padding: 0.875rem 1rem 1rem; }
.pg-card-title { font-weight: 500; color: #1A1916; margin: 0 0 0.2rem; font-size: 0.9rem; line-height: 1.3; transition: color 0.15s; }
.pg-card-desc { font-size: 0.8rem; color: #717070; line-height: 1.5; }

/* Fade in — same as index */
.fade-in { opacity: 0; transform: translateY(16px); transition: opacity 0.55s ease-out, transform 0.55s ease-out; }
.fade-in.visible { opacity: 1; transform: translateY(0); }

footer { border-top: 0.5px solid rgba(232,226,217,0.9); padding: 1.5rem; text-align: center; font-size: 0.75rem; color: #6E6C6B; }

@media (max-width: 700px) {
  .nav-right { display: none; }
  .hero-h1 { font-size: 2rem; }
  .pg-grid { grid-template-columns: 1fr; }
}
</style>

<script>
const nav = document.getElementById('top-nav');
let lastScroll = 0, ticking = false;
window.addEventListener('scroll', () => {
  if (!ticking) {
    window.requestAnimationFrame(() => {
      const cur = window.pageYOffset;
      if (cur <= 0) nav.classList.remove('hidden');
      else if (cur > lastScroll && cur > 80) nav.classList.add('hidden');
      else nav.classList.remove('hidden');
      lastScroll = cur;
      ticking = false;
    });
    ticking = true;
  }
});
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>
<script src="js/scroll-reveal.js" defer></script>
